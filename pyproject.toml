[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hadesx-decoder"
version = "1.2.0"
description = "HADESx Decoder: decoder for the HADES family of amateur-radio satellites (UNNE-1B / HADES-E2, HADES-SA, HADES-L): 200 and 800 baud FSK telemetry, CODEC2 voice and SSDV pictures from SDR recordings, with automatic Doppler tracking"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "N6RFM" }]
keywords = ["amateur radio", "satellite", "HADESx", "HADES", "UNNE-1B", "HADES-SA", "HADES-L", "HADES-E2", "AMSAT-EA", "FSK", "codec2", "gnuradio"]
dependencies = ["numpy>=1.21", "scipy>=1.7"]

[project.optional-dependencies]
dll = ["unicorn>=2.0", "pefile"]
dev = ["pytest", "matplotlib", "pyyaml"]

[project.urls]
Homepage = "https://github.com/N6RFM/HADESx-Decoder"
Issues = "https://github.com/N6RFM/HADESx-Decoder/issues"

[project.scripts]
hadesx-decode = "hadesx.cli:main"
hadesx-voice = "hadesx.voice:main"
hadesx-report = "hadesx.report:main"
hadesx-ssdv = "hadesx.ssdv:main"
# the old names keep working (deprecated)
unne1b-decode = "hadesx.cli:main"
unne1b-voice = "hadesx.voice:main"
unne1b-report = "hadesx.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
